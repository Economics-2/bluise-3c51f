  <!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head>
    {{ HEAD }}
  </head>

  <body {{ BODY_ATTRS }}>
    <script>
      ;(function () {
        try {
          var t = window.localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })()
    </script>
    {{ APP }}

    <noscript>
      <p>
        জাভাস্ক্রিপ্ট বন্ধ রয়েছে — এই ওয়েবসাইটটি সঠিকভাবে দেখতে জাভাস্ক্রিপ্ট চালু করুন।
      </p>
    </noscript>
  </body>
</html>
